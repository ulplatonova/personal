<title>Контент-план Ульяны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Layout: одна узкая колонка как в Telegram Mini App. Внизу три вкладки (План, Идеи, Снято), поверх всего шторка редактирования.
   Палитра Ульяны (26.11): 70% основные, 25% дополнительные, 5% акцентные. Шрифты из blog/matrix/index.html. */
:root{
  --bg:#DDD6CC; --surface:#E8E3DB; --ink:#1D1C1E; --muted:#53433B; --line:#C6BDB2; --line-strong:#978B80;
  --accent:#5E2430; --on-accent:#E8E3DB; --accent-soft:#CDBFBC; --blue:#1D1C1E; --blue-soft:#8496A7;
  --warn:#8F313B; --track:#C6BDB2; --scrim:rgba(29,28,30,.45);
  --font:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Unbounded","Inter Tight",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1C1E; --surface:#28272A; --ink:#DDD6CC; --muted:#A2A1A0; --line:#414145; --line-strong:#5C5B60;
  --accent:#B28350; --on-accent:#1D1C1E; --accent-soft:#53433B; --blue:#A9B7C4; --blue-soft:#3A3F46;
  --warn:#E0868D; --track:#414145; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1C1E; --surface:#28272A; --ink:#DDD6CC; --muted:#A2A1A0; --line:#414145; --line-strong:#5C5B60;
  --accent:#B28350; --on-accent:#1D1C1E; --accent-soft:#53433B; --blue:#A9B7C4; --blue-soft:#3A3F46;
  --warn:#E0868D; --track:#414145; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:20px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

h1{font-family:var(--display);font-size:22px;line-height:1.15;letter-spacing:-.02em;font-weight:600;margin:0;text-wrap:balance}
.head{display:flex;flex-direction:column;gap:12px}
.head-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.today{color:var(--muted);font-size:13px;white-space:nowrap}
.next{margin:0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px;min-width:0;overflow-wrap:anywhere}
.next b{font-weight:600}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

.week{display:flex;flex-direction:column;gap:8px}
.week h2{margin:0;display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row+.row{border-top:1px solid var(--line)}
.row-head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.check{position:relative;flex:none;width:28px;height:28px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;display:grid;place-items:center;color:transparent;font-size:15px;line-height:1;padding:0}
.check::after{content:"";position:absolute;inset:-9px}
.check:hover{border-color:var(--accent)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.when{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.when .late{color:var(--warn)}
.title{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11.5px;line-height:1;padding:5px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.pill.series{background:var(--accent-soft);color:var(--accent)}
.chev{flex:none;color:var(--muted);font-size:13px;margin-top:3px;transition:transform .15s}
.row.open .chev{transform:rotate(180deg)}
.row-body{padding:0 14px 14px 54px;display:flex;flex-direction:column;gap:12px}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.script-label{margin:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.script{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.script.empty{color:var(--muted);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn);border-color:transparent}
.btn.ghost{border-color:transparent;color:var(--muted)}
.row.done .title{text-decoration:line-through;color:var(--muted)}

.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{min-height:160px;resize:vertical;line-height:1.5}
.hint{margin:0;color:var(--muted);font-size:13px}
.empty-state{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px}
.empty-state b{display:block;color:var(--ink);margin-bottom:4px;font-weight:600}
.foot{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-top:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:12px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12.5px;font-weight:500;min-height:56px}
nav.tabs button b{font-family:var(--display);font-weight:500;font-size:12px;color:inherit}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"] b{font-weight:600}
nav.tabs .count{font-size:11.5px;opacity:.85}
.fab{position:fixed;z-index:6;bottom:calc(72px + env(safe-area-inset-bottom,0px));right:max(16px,calc((100vw - 560px)/2 + 16px));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);display:grid;place-items:center;padding:0 0 3px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.sheet-actions .grow{display:flex;gap:8px;flex-wrap:wrap}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500}
.pick button:hover{border-color:var(--accent)}

.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<div id="layer"></div>
<div id="toastbox"></div>
<button class="fab" id="fab" type="button" aria-label="Добавить тему в план">+</button>
<nav class="tabs" aria-label="Разделы">
  <div role="tablist" id="tabs"></div>
</nav>

<script>
/* ---------- Данные ---------- */
const KEY = 'ulya-plan-v1';
const KINDS = ['Рилс', 'Пост'];
const FORMATS = ['Закадровый голос', 'Говорю в камеру', 'Примерка / распаковка', 'Процесс', 'Эстетика без слов'];
const HOWS = ['На штатив', 'С рук', 'С рук + голос потом'];
const SERIES = ['Собираюсь', 'Подарки', 'Покупки', 'Коди'];
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const WD_LONG = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MON_LONG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

let uid = 0;
const newId = () => 'i' + Date.now().toString(36) + (uid++).toString(36);

/* Тема, пример. Взято из blog/06-content-plan.md (недели 3 и 4) и blog/07-content-matrix.md. */
function seed() {
  const it = (date, title, format, how, series, script) =>
    ({ id: newId(), title, kind: 'Рилс', date, format, how, series, script, done: false });
  return {
    items: [
      it('2026-11-23', 'Подарки, часть 2', 'Говорю в камеру', 'На штатив', 'Подарки',
        'По комментариям к части 1: например, подарки подруге или до определённой суммы. Как часть 1: фото вещей поверх кадра.'),
      it('2026-11-25', 'Собирайся со мной #2', 'Говорю в камеру', 'На штатив', 'Собираюсь',
        'Серия продолжается: другой образ, тот же формат.'),
      it('2026-11-27', 'Что есть у Коди и что реально пригодилось', 'Закадровый голос', 'С рук + голос потом', 'Коди',
        'Вещи для собаки, красивые и полезные. Портфолио для брендов товаров для животных.'),
      it('2026-11-29', 'История про характер', 'Говорю в камеру', 'На штатив', '',
        'Реальный случай: как отстояла своё, договорилась или научилась говорить «нет». [Какой именно случай — впишите сами]'),
      it('2026-11-30', 'Подарки, часть 3: красиво упаковать', 'Процесс', 'С рук + голос потом', 'Подарки',
        'Упаковка подарков: польза и эстетика.'),
      it('2026-12-02', 'Готовлю дом к Новому году', 'Закадровый голос', 'С рук + голос потом', '',
        'Декор, свет, мелочи, где взяла.'),
      it('2026-12-04', 'Что купила за ноябрь', 'Примерка / распаковка', '', 'Покупки',
        'Итоги месяца, связка с постом в Telegram.'),
      it('2026-12-06', 'Отвечаю на ваши вопросы', 'Говорю в камеру', 'На штатив', '',
        'Самые частые вопросы из комментариев и сторис за месяц.')
    ],
    ideas: [
      { id: newId(), title: 'Как я продаю вещи на Авито глазами маркетолога', note: 'Из матрицы, приоритет 2.', added: '2026-11-26' },
      { id: newId(), title: 'Блокнот за 300 ₽ и за 3000 ₽: есть ли разница', note: 'Из матрицы, приоритет 3.', added: '2026-11-26' },
      { id: newId(), title: 'Рандомные вещи, которые меня вдохновляют', note: 'Серия: каждая вещь отдельным роликом.', added: '2026-11-26' },
      { id: newId(), title: 'Коди опять ходит на задних лапах', note: '', added: '2026-11-26' }
    ]
  };
}

/* Хранилище. Сейчас localStorage в этом браузере.
   В боте этот слой заменяется на запросы к API (см. app/README.md): load() станет GET /api/plan, save() станет PUT по отдельной записи. */
const store = {
  load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify({ items: s.items, ideas: s.ideas })); } catch (e) {} }
};

const loaded = store.load();
const S = { items: loaded ? loaded.items : seed().items, ideas: loaded ? loaded.ideas : seed().ideas, tab: 'plan', open: null };
const persist = () => store.save(S);

/* ---------- Утилиты ---------- */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(c)); }
  return n;
}
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const two = n => String(n).padStart(2, '0');
const shortDate = s => { const d = pd(s); return WD[d.getDay()] + ' ' + two(d.getDate()) + '.' + two(d.getMonth() + 1); };
const longDate = s => { const d = pd(s); return WD_LONG[d.getDay()] + ', ' + d.getDate() + ' ' + MON_LONG[d.getMonth()]; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
function weekStart(d) { const r = new Date(d); r.setDate(r.getDate() - ((r.getDay() + 6) % 7)); return r; }
function weekLabel(ws) {
  const we = new Date(ws); we.setDate(we.getDate() + 6);
  return ws.getMonth() === we.getMonth()
    ? ws.getDate() + '–' + we.getDate() + ' ' + MON[we.getMonth()]
    : ws.getDate() + ' ' + MON[ws.getMonth()] + ' – ' + we.getDate() + ' ' + MON[we.getMonth()];
}
const byDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || a.title.localeCompare(b.title);
const find = id => S.items.find(i => i.id === id);

/* ---------- Отмена действий ---------- */
let toastTimer = null;
function toast(msg, undoLabel, undo) {
  clearTimeout(toastTimer);
  const box = document.getElementById('toastbox');
  box.replaceChildren();
  const t = el('div', { class: 'toast', role: 'status' }, el('span', null, msg));
  if (undo) t.append(el('button', { type: 'button', onclick: () => { undo(); box.replaceChildren(); } }, undoLabel || 'Вернуть'));
  box.append(t);
  toastTimer = setTimeout(() => box.replaceChildren(), 6000);
}

/* ---------- Шторка (редактирование) ---------- */
function closeSheet() { document.getElementById('layer').replaceChildren(); document.removeEventListener('keydown', escClose); }
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function openSheet(children) {
  const layer = document.getElementById('layer');
  const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, children);
  const scrim = el('div', { class: 'scrim', onclick: e => { if (e.target === scrim) closeSheet(); } }, sheet);
  layer.replaceChildren(scrim);
  document.addEventListener('keydown', escClose);
  const first = sheet.querySelector('input,textarea,select,button');
  if (first) first.focus({ preventScroll: true });
}
function field(id, label, control) { return el('div', { class: 'field' }, el('label', { for: id }, label), control); }
function select(id, opts, val, emptyLabel) {
  const s = el('select', { id }, el('option', { value: '' }, emptyLabel), opts.map(o => el('option', { value: o }, o)));
  s.value = val || '';
  return s;
}

/* Одна шторка и для новой темы, и для правки, и для «В план» из идей. */
function itemSheet(item, opts = {}) {
  const isNew = !S.items.includes(item);
  const f = {
    title: el('input', { type: 'text', id: 'f-title', value: item.title || '', placeholder: 'Тема, как она звучит для вас' }),
    date: el('input', { type: 'date', id: 'f-date', value: item.date || '' }),
    kind: select('f-kind', KINDS, item.kind || 'Рилс', ''),
    format: select('f-format', FORMATS, item.format, 'Не выбран'),
    how: select('f-how', HOWS, item.how, 'Не выбрано'),
    series: select('f-series', SERIES, item.series, 'Без серии'),
    script: el('textarea', { id: 'f-script', placeholder: 'Опорные точки и примеры фраз. Не текст для заучивания.' })
  };
  f.kind.querySelector('option[value=""]').remove();
  f.script.value = item.script || '';
  const err = el('p', { class: 'hint', style: 'color:var(--warn)', hidden: true }, 'Впишите тему, без неё запись не сохранится.');
  const save = () => {
    const title = f.title.value.trim();
    if (!title) { err.hidden = false; f.title.focus(); return; }
    Object.assign(item, { title, date: f.date.value, kind: f.kind.value, format: f.format.value, how: f.how.value, series: f.series.value, script: f.script.value.trim() });
    if (isNew) S.items.push(item);
    if (opts.fromIdea) S.ideas = S.ideas.filter(i => i.id !== opts.fromIdea);
    if (item.date) S.open = item.id;
    persist(); closeSheet(); S.tab = 'plan'; render();
  };
  openSheet([
    el('h2', null, isNew ? 'Новая тема в плане' : 'Правка темы'),
    field('f-title', 'Тема', f.title), err,
    el('div', { class: 'two' }, field('f-date', 'Когда', f.date), field('f-kind', 'Что это', f.kind)),
    el('div', { class: 'two' }, field('f-format', 'Формат', f.format), field('f-how', 'Как снять', f.how)),
    field('f-series', 'Серия', f.series),
    field('f-script', 'Сценарий и заметки', f.script),
    el('div', { class: 'sheet-actions' },
      !isNew ? el('button', { class: 'btn danger', type: 'button', onclick: () => { closeSheet(); removeItem(item.id); } }, 'Удалить') : el('span'),
      el('div', { class: 'grow' },
        el('button', { class: 'btn ghost', type: 'button', onclick: closeSheet }, 'Отмена'),
        el('button', { class: 'btn primary', type: 'button', onclick: save }, 'Сохранить')))
  ]);
}

function ideaSheet(idea) {
  const isNew = !S.ideas.includes(idea);
  const t = el('input', { type: 'text', id: 'g-title', value: idea.title || '', placeholder: 'Тезис в одну строку' });
  const n = el('textarea', { id: 'g-note', placeholder: 'Что-то ещё, если хочется (необязательно)', style: 'min-height:110px' });
  n.value = idea.note || '';
  const save = () => {
    const title = t.value.trim(); if (!title) { t.focus(); return; }
    Object.assign(idea, { title, note: n.value.trim() });
    if (isNew) S.ideas.unshift(idea);
    persist(); closeSheet(); render();
  };
  openSheet([
    el('h2', null, isNew ? 'Новая идея' : 'Правка идеи'),
    field('g-title', 'Тезис', t), field('g-note', 'Заметка', n),
    el('div', { class: 'sheet-actions' }, el('span'),
      el('div', { class: 'grow' },
        el('button', { class: 'btn ghost', type: 'button', onclick: closeSheet }, 'Отмена'),
        el('button', { class: 'btn primary', type: 'button', onclick: save }, 'Сохранить')))
  ]);
}

/* «Заменить»: берём тему из идей на то же место и дату, прежняя тема возвращается в идеи. */
function swapSheet(item) {
  const list = S.ideas.length
    ? el('div', { class: 'pick' }, S.ideas.map(idea => el('button', { type: 'button', onclick: () => {
        S.ideas = S.ideas.filter(i => i.id !== idea.id);
        S.ideas.unshift({ id: newId(), title: item.title, note: item.script || '', added: iso(new Date()) });
        item.title = idea.title; item.script = idea.note || ''; item.done = false;
        persist(); closeSheet(); render();
        toast('Тема заменена, прежняя ушла в «Идеи»');
        itemSheet(item);
      } }, idea.title)))
    : el('p', { class: 'hint' }, 'В «Идеях» пока пусто. Впишите идею там, и её можно будет поставить сюда.');
  openSheet([
    el('h2', null, 'Чем заменить?'),
    el('p', { class: 'hint' }, 'Дата и формат останутся. Прежняя тема вернётся в идеи.'),
    list,
    el('div', { class: 'sheet-actions' }, el('span'), el('button', { class: 'btn ghost', type: 'button', onclick: closeSheet }, 'Закрыть'))
  ]);
}

/* ---------- Действия ---------- */
function removeItem(id) {
  const idx = S.items.findIndex(i => i.id === id); if (idx < 0) return;
  const [gone] = S.items.splice(idx, 1);
  persist(); render();
  toast('Тема удалена', 'Вернуть', () => { S.items.splice(idx, 0, gone); persist(); render(); });
}
function removeIdea(id) {
  const idx = S.ideas.findIndex(i => i.id === id); if (idx < 0) return;
  const [gone] = S.ideas.splice(idx, 1);
  persist(); render();
  toast('Идея удалена', 'Вернуть', () => { S.ideas.splice(idx, 0, gone); persist(); render(); });
}
function toggleDone(id) {
  const it = find(id); if (!it) return;
  it.done = !it.done; if (it.done) S.open = null;
  persist(); render();
  toast(it.done ? 'Отмечено как снятое' : 'Вернулось в план', 'Отменить', () => { it.done = !it.done; persist(); render(); });
}

/* ---------- Отрисовка ---------- */
function rowEl(it, mode) {
  const open = S.open === it.id && mode === 'plan';
  const late = it.date && !it.done && pd(it.date) < today();
  const head = el('div', { class: 'row-head' },
    el('button', { class: 'check', type: 'button', 'aria-pressed': String(it.done), 'aria-label': it.done ? 'Вернуть в план' : 'Отметить снятым', onclick: () => toggleDone(it.id) }, '✓'),
    el('button', { class: 'row-main', type: 'button', 'aria-expanded': String(open), onclick: () => { S.open = open ? null : it.id; render(); } },
      el('span', { class: 'when' },
        it.date ? el('span', null, shortDate(it.date)) : el('span', null, 'Без даты'),
        late && el('span', { class: 'late' }, 'дата прошла')),
      el('span', { class: 'title' }, it.title),
      el('span', { class: 'tags' },
        el('span', { class: 'pill' }, it.kind),
        it.format && el('span', { class: 'pill' }, it.format),
        it.series && el('span', { class: 'pill series' }, it.series))),
    mode === 'plan' && el('span', { class: 'chev', 'aria-hidden': 'true' }, '▾'));
  const row = el('article', { class: 'row' + (open ? ' open' : '') + (it.done ? ' done' : '') }, head);
  if (open) {
    row.append(el('div', { class: 'row-body' },
      el('dl', { class: 'facts' },
        el('dt', null, 'Когда'), el('dd', null, it.date ? longDate(it.date) : 'дата не выбрана'),
        el('dt', null, 'Формат'), el('dd', null, it.format || 'не выбран'),
        el('dt', null, 'Как снять'), el('dd', null, it.how || 'не выбрано')),
      el('div', null,
        el('p', { class: 'script-label' }, 'Сценарий и заметки'),
        it.script
          ? el('p', { class: 'script' }, it.script)
          : el('p', { class: 'script empty' }, 'Сценария пока нет. Нажмите «Править» и впишите опорные точки.')),
      el('div', { class: 'actions' },
        el('button', { class: 'btn', type: 'button', onclick: () => itemSheet(it) }, 'Править'),
        el('button', { class: 'btn', type: 'button', onclick: () => swapSheet(it) }, 'Заменить'),
        el('button', { class: 'btn danger', type: 'button', onclick: () => removeItem(it.id) }, 'Удалить'))));
  }
  return row;
}

function viewPlan() {
  const out = [];
  const openItems = S.items.filter(i => !i.done).sort(byDate);
  const t = today();
  const next = openItems.find(i => i.date && pd(i.date) >= t) || openItems[0];
  const total = S.items.length, done = S.items.filter(i => i.done).length;
  out.push(el('div', { class: 'head' },
    el('div', { class: 'head-top' }, el('h1', null, 'Контент-план'), el('span', { class: 'today' }, WD_LONG[t.getDay()] + ', ' + t.getDate() + ' ' + MON_LONG[t.getMonth()])),
    next && el('p', { class: 'next' }, 'Ближайшее: ', el('b', null, next.title), next.date ? ', ' + shortDate(next.date) : ''),
    el('div', { class: 'meter' },
      el('div', { class: 'meter-row' }, el('span', null, 'Снято'), el('span', null, done + ' из ' + total)),
      el('div', { class: 'bar' }, el('i', { style: 'width:' + (total ? Math.round(done / total * 100) : 0) + '%' })))));

  if (!openItems.length) {
    out.push(el('div', { class: 'empty-state' }, el('b', null, 'В плане пусто'), 'Нажмите + или возьмите тему из «Идей».'));
    return out;
  }
  const groups = new Map();
  for (const it of S.items.slice().sort(byDate)) {
    const key = it.date ? iso(weekStart(pd(it.date))) : 'none';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  for (const [key, arr] of groups) {
    const rest = arr.filter(i => !i.done);
    if (!rest.length) continue;
    const label = key === 'none' ? 'Без даты' : 'Неделя ' + weekLabel(pd(key));
    out.push(el('section', { class: 'week' },
      el('h2', null, el('span', null, label), el('span', null, 'снято ' + arr.filter(i => i.done).length + ' из ' + arr.length)),
      el('div', { class: 'list' }, rest.map(i => rowEl(i, 'plan')))));
  }
  return out;
}

function viewIdeas() {
  const input = el('input', { type: 'text', id: 'quick', placeholder: 'Тезис идеи одной строкой', autocomplete: 'off' });
  const add = () => {
    const v = input.value.trim(); if (!v) { input.focus(); return; }
    S.ideas.unshift({ id: newId(), title: v, note: '', added: iso(new Date()) });
    persist(); render(); const q = document.getElementById('quick'); if (q) q.focus();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  const out = [
    el('div', { class: 'head' },
      el('h1', null, 'Идеи'),
      el('div', { class: 'quick' }, input, el('button', { class: 'btn primary', type: 'button', onclick: add }, 'Добавить')),
      el('p', { class: 'hint' }, 'В боте то же самое: пишете ему сообщение, и оно появляется здесь.'))
  ];
  if (!S.ideas.length) {
    out.push(el('div', { class: 'empty-state' }, el('b', null, 'Идей пока нет'), 'Впишите первую в строку выше.'));
    return out;
  }
  out.push(el('div', { class: 'list' }, S.ideas.map(idea => el('article', { class: 'row' },
    el('div', { class: 'row-head', style: 'flex-direction:column;gap:10px' },
      el('div', null,
        el('div', { class: 'title' }, idea.title),
        idea.note && el('div', { class: 'hint', style: 'margin-top:3px;overflow-wrap:anywhere' }, idea.note)),
      el('div', { class: 'actions' },
        el('button', { class: 'btn primary', type: 'button', onclick: () => itemSheet({ title: idea.title, kind: 'Рилс', script: idea.note || '' }, { fromIdea: idea.id }) }, 'В план'),
        el('button', { class: 'btn', type: 'button', onclick: () => ideaSheet(idea) }, 'Править'),
        el('button', { class: 'btn danger', type: 'button', onclick: () => removeIdea(idea.id) }, 'Удалить')))))));
  return out;
}

function viewDone() {
  const items = S.items.filter(i => i.done).sort((a, b) => byDate(b, a));
  const out = [el('div', { class: 'head' }, el('h1', null, 'Снято'), el('p', { class: 'hint' }, 'Отметьте круг ещё раз, и тема вернётся в план.'))];
  if (!items.length) { out.push(el('div', { class: 'empty-state' }, el('b', null, 'Пока ничего не отмечено'), 'Снятое из плана окажется здесь.')); return out; }
  out.push(el('div', { class: 'list' }, items.map(i => rowEl(i, 'done'))));
  return out;
}

let resetArmed = false;
function footer() {
  const b = el('button', { class: 'btn ghost', type: 'button' }, resetArmed ? 'Точно сбросить на пример?' : 'Сбросить на пример');
  b.addEventListener('click', () => {
    if (!resetArmed) { resetArmed = true; render(); setTimeout(() => { resetArmed = false; render(); }, 3500); return; }
    const s = seed(); S.items = s.items; S.ideas = s.ideas; S.open = null; resetArmed = false; persist(); render();
  });
  return el('div', { class: 'foot' },
    el('p', { class: 'hint' }, 'Это прототип. Записи хранятся только в этом браузере. В боте они будут в базе и на всех ваших устройствах.'), b);
}

function render() {
  const app = document.getElementById('app');
  const view = S.tab === 'plan' ? viewPlan() : S.tab === 'ideas' ? viewIdeas() : viewDone();
  const keep = document.activeElement && document.activeElement.id === 'quick' ? document.activeElement.value : null;
  app.replaceChildren(...view, footer());
  if (keep) { const q = document.getElementById('quick'); if (q) q.value = keep; }
  const tabs = [['plan', 'План', S.items.filter(i => !i.done).length], ['ideas', 'Идеи', S.ideas.length], ['done', 'Снято', S.items.filter(i => i.done).length]];
  document.getElementById('tabs').replaceChildren(...tabs.map(([k, name, n]) =>
    el('button', { type: 'button', role: 'tab', 'aria-selected': String(S.tab === k), onclick: () => { S.tab = k; render(); window.scrollTo(0, 0); } },
      el('b', null, name), el('span', { class: 'count' }, String(n)))));
  document.getElementById('fab').hidden = S.tab === 'done';
}

document.getElementById('fab').addEventListener('click', () => {
  if (S.tab === 'ideas') ideaSheet({ title: '', note: '' });
  else itemSheet({ title: '', kind: 'Рилс', date: '', format: '', how: '', series: '', script: '', done: false, id: newId() });
});
render();
</script>
