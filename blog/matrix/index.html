<title>Матрица контента Ульяны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: узкая правая панель. Четыре вкладки: неделя роликов с галочками, идеи по типам, путь к брендам, вкусы. */
:root{
  --bg:#F9F9F9; --surface:#FFFFFF; --ink:#2B1214; --muted:#6B5F63; --line:#E3E0E1;
  --accent:#681A1D; --on-accent:#F9F9F9; --accent-soft:#E4EAF0; --bracket:#681A1D;
  --warn:#681A1D; --warn-soft:#F1DDDD; --new:#3F5670; --new-soft:#E4EAF0; --blue:#7A91A9;
  --ok:#3F5670; --track:#E9E5E6;
  --font:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Unbounded","Inter Tight",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170C0E; --surface:#231316; --ink:#F2EAEA; --muted:#B3A3A6; --line:#3D2A2D;
  --accent:#A9BCD0; --on-accent:#170C0E; --accent-soft:#2A3440; --bracket:#E6A3A7;
  --warn:#E6A3A7; --warn-soft:#4A1D21; --new:#A9BCD0; --new-soft:#2A3440; --blue:#7A91A9;
  --ok:#A9BCD0; --track:#3D2A2D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170C0E; --surface:#231316; --ink:#F2EAEA; --muted:#B3A3A6; --line:#3D2A2D;
  --accent:#A9BCD0; --on-accent:#170C0E; --accent-soft:#2A3440; --bracket:#E6A3A7;
  --warn:#E6A3A7; --warn-soft:#4A1D21; --new:#A9BCD0; --new-soft:#2A3440; --blue:#7A91A9;
  --ok:#A9BCD0; --track:#3D2A2D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:600;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;line-height:1.3;letter-spacing:-.01em;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-family:var(--display);font-weight:500;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs .chip{font-size:12.5px}
.note{margin:0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.facts b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.done{opacity:.72}
.card-head{display:flex;flex-direction:column;gap:6px}
.kind{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--display);font-size:10px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;border-radius:4px;padding:2px 7px}
.tag.type{background:var(--accent-soft);color:var(--ink)}
.tag.q{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--new-soft);color:var(--new)}
.tag.p{background:var(--accent);color:var(--on-accent)}
.tag.b{background:var(--new-soft);color:var(--new)}
.title{font-size:16px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px}
.ck{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;margin:0}
.br{color:var(--bracket);background:var(--accent-soft);border-radius:4px;padding:0 4px}
details.more summary{cursor:pointer;font-size:13.5px;color:var(--muted);list-style:none;padding:2px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";}
details.more[open] summary::before{content:"– ";}
.lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 4px}
.body p{margin:0 0 8px}
.body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.group{display:flex;flex-direction:column;gap:10px}
.group-head{border-top:3px solid var(--accent);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.group-head p{margin:0;color:var(--muted);font-size:13.5px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.idea.done{opacity:.72}
.idea .t{margin:0;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.idea .kind{gap:5px}
.stage{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.stage:first-of-type{border-top:0}
.stage b{font-family:var(--display);font-size:11px;font-weight:500;color:var(--accent)}
.pref{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pref ul,.plain{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.pref h4{margin:0 0 6px;font-size:13px}
.foot{color:var(--muted);font-size:13px;margin:0}
.empty{color:var(--muted);font-size:14px;margin:0}
@media (max-width:420px){.stage{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .15s,border-color .15s}.bar i{transition:width .25s}}
</style>

<div class="wrap">
  <header>
    <h1>Матрица контента</h1>
    <p class="sub">Неделя роликов, идеи по четырём типам и путь к брендам. Галочки сохраняются сами. Правки скажи мне в чате, я обновлю и запомню.</p>
  </header>

  <p class="note" id="note" hidden></p>

  <nav class="chips tabs" id="tabs" aria-label="Разделы"></nav>

  <section id="p-week" class="stack"></section>
  <section id="p-ideas" class="stack" hidden></section>
  <section id="p-brands" class="stack" hidden></section>
  <section id="p-prefs" class="stack" hidden></section>

  <p class="foot">Отмеченное <span class="br">[в скобках]</span> заполняешь ты: это реальные факты. Не трогаем: партнёра и отношения, квартиру целиком.</p>
</div>

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const br=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="br">[$1]</span>');
const $=id=>document.getElementById(id);

/* прогресс: id -> {shot, posted} */
let state={}, db=null;
const queues={};
const isShot=id=>!!(state[id]&&state[id].shot);
const isPosted=id=>!!(state[id]&&state[id].posted);

function note(text){const n=$('note');if(text){n.textContent=text;n.hidden=false}else{n.hidden=true}}

function checks(id){
  return '<div class="checks"><label class="ck"><input type="checkbox" data-id="'+id+'" data-k="shot"> Снято</label>'+
         '<label class="ck"><input type="checkbox" data-id="'+id+'" data-k="posted"> Опубликовано</label></div>';
}
function flagTags(f){
  return (f||[]).map(x=>x==='b'?'<span class="tag b">🤝 для брендов</span>':x==='q'?'<span class="tag q">под вопросом</span>':x==='new'?'<span class="tag new">новое</span>':x==='s'?'<span class="tag p">сезон: сейчас</span>':'<span class="tag p">приоритет '+x+'</span>').join('');
}

function weekHTML(){
  const cards=WEEK.map(w=>{
    const T=TYPES[w.type];
    return '<article class="card" data-card="'+w.id+'"><div class="card-head"><div class="kind"><span>'+w.day+'</span><span class="tag type">'+T.e+' '+T.n+'</span>'+(w.brand?'<span class="tag b">🤝 для брендов</span>':'')+'</div>'+
      '<h2 class="title">'+br(w.title)+'</h2></div>'+checks(w.id)+
      '<details class="more"><summary>Хук, текст, как снять</summary><div class="body">'+
      '<div class="lbl">Хук</div><p>'+br(w.hook)+'</p>'+
      '<div class="lbl">'+(w.type==='boost'?'Текст на экране':'Текст в камеру')+'</div><ol>'+w.text.map(x=>'<li>'+br(x)+'</li>').join('')+'</ol>'+
      '<div class="lbl">Как снять</div><p>'+br(w.how)+'</p>'+
      '<div class="lbl">Призыв</div><p>'+br(w.cta)+'</p>'+
      (w.brand?'<div class="lbl">Для брендов</div><p>'+br(w.brand)+'</p>':'')+
      '</div></details></article>';
  }).join('');
  return '<div class="panel"><h3>Неделя 1 · 3-4 ролика</h3><div class="meter"><div class="meter-row"><span>Снято</span><span class="num" id="m-week">0 из '+WEEK.length+'</span></div><div class="bar"><i id="b-week"></i></div>'+
    '<div class="meter-row"><span>Опубликовано</span><span class="num" id="m-weekp">0 из '+WEEK.length+'</span></div><div class="bar"><i id="b-weekp"></i></div></div></div>'+
    cards+
    '<div class="panel"><h3>Как снять неделю за один подход</h3><p class="empty">Сначала дом: дни 1 и 3 в одном образе и при одном свете, до 20 минут на ролик. Потом всё с собакой и выходным: дни 2 и 4. Снимай кусками по одной-две фразы, голос по дням 1, 3 и 4 запишешь отдельно.</p></div>'+
    '<div class="panel"><h3>Что уже вышло</h3><ul class="facts">'+SEEN.map(s=>'<li><b>'+esc(s[0])+':</b> '+esc(s[1])+'</li>').join('')+'</ul><p class="foot" style="margin-top:10px">Пока лучше всего работают ролики без слов и голос поверх кадров. Разговорные в камеру пока слабее.</p></div>'+
    '<div class="panel"><h3>Через неделю смотрим</h3><ul class="plain"><li>🟢 подписки: сравни с 40 на 100 000 просмотров у шкафа</li><li>🔵 просмотры: ориентир ролик на 40 000</li><li>💛 сообщения в директ и ответы на сторис</li></ul></div>';
}

let ftype='all', fbrand=false, fopen=false;
function ideaRows(){
  const types=['sub','boost','lich','fun'];
  return types.filter(t=>ftype==='all'||ftype===t).map(t=>{
    const T=TYPES[t];
    let list=IDEAS.filter(i=>i.type===t);
    if(fbrand) list=list.filter(i=>i.f.includes('b'));
    if(fopen) list=list.filter(i=>!isShot(i.id));
    const items=list.map(i=>'<div class="idea" data-card="'+i.id+'"><p class="t">'+br(i.t)+'</p><div class="kind"><span class="tag type">'+esc(i.th)+'</span>'+flagTags(i.f)+'</div>'+checks(i.id)+'</div>').join('');
    const empty=t==='fun'?'<p class="empty">Пока пусто. Вернёмся, когда будет что раздавать по кодовому слову, например список средств из ролика.</p>':(list.length?'':'<p class="empty">Здесь ничего не осталось по этим фильтрам.</p>');
    return '<div class="group"><div class="group-head"><h2>'+T.e+' '+T.n+'</h2><p>'+T.d+'</p></div>'+items+empty+'</div>';
  }).join('');
}
function ideasHTML(){
  const chips=[['all','Все типы']].concat(Object.keys(TYPES).map(k=>[k,TYPES[k].e+' '+TYPES[k].n]));
  return '<div class="chips" id="f-types">'+chips.map(c=>'<button type="button" class="chip" data-t="'+c[0]+'" aria-pressed="'+(ftype===c[0])+'">'+c[1]+'</button>').join('')+'</div>'+
    '<div class="chips" id="f-flags"><button type="button" class="chip" data-f="brand" aria-pressed="'+fbrand+'">🤝 для брендов</button><button type="button" class="chip" data-f="open" aria-pressed="'+fopen+'">не снято</button></div>'+
    '<p class="foot">Идеи из матрицы разложены по типам. Раскладка моя, скажи, что переставить.</p>'+
    '<div class="stack" id="idea-rows">'+ideaRows()+'</div>';
}

function brandsHTML(){
  return '<div class="panel"><h3>Цель</h3><p class="empty" style="color:var(--ink)">Чтобы бренды присылали подарки, а ты делала обзоры и распаковки. Сначала бартеры, потом платная реклама, в основном через Telegram.</p></div>'+
   '<div class="panel"><h3>Портфолио</h3><div class="meter"><div class="meter-row"><span>Роликов 🤝 снято</span><span class="num" id="m-brand">0</span></div><div class="bar"><i id="b-brand"></i></div></div><p class="foot" style="margin-top:10px">Считаются ролики недели и идеи с пометкой «для брендов». Снимай вещи, которые уже есть, как рекламу и отмечай бренд.</p></div>'+
   '<div class="panel"><h3>Путь</h3>'+
    '<div class="stage"><b>Месяцы 1-2</b><span>3-4 качественных ролика в неделю. Среди них регулярно распаковки и обзоры с честным минусом: это портфолио.</span></div>'+
    '<div class="stage"><b>Месяц 3</b><span>Медиакит: ниша, аудитория, охваты, лучшие ролики. Первые письма небольшим брендам: дом, свечи, уход, аксессуары, товары для собак. Письмо с готовой идеей ролика, как ты умеешь как маркетолог.</span></div>'+
    '<div class="stage"><b>Дальше</b><span>Бартеры, потом платная реклама. Рекламу нужно маркировать, а платные интеграции у российских брендов идут в основном в Telegram и VK.</span></div></div>'+
   '<div class="panel"><h3>Для медиакита, заполнить</h3><ul class="plain"><li>Подписчики сейчас: 600, в основном знакомые</li><li>Аудитория, кого хочешь: сильные, умные девушки 20-35</li><li>Лучшие ролики: [ссылки]</li><li>Охваты за месяц: [цифра]</li></ul></div>';
}

function prefsHTML(){
  return '<div class="panel pref"><div><h4>Нравится</h4><ul>'+LIKE.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div><h4>Не нравится</h4><ul>'+DISLIKE.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>'+
   '<div class="panel"><h3>Шапка профиля</h3><p class="empty" style="color:var(--ink)">неидеальная блондинка · лайфстайл</p></div>';
}

/* обновление галочек и счётчиков без перерисовки карточек */
function bar(idm,idb,n,total,label){
  const m=$(idm), b=$(idb); if(!m||!b) return;
  m.textContent=label!=null?label:(n+' из '+total);
  b.style.width=(total?Math.round(n/total*100):0)+'%';
}
function refresh(){
  document.querySelectorAll('input[data-id]').forEach(el=>{
    const id=el.dataset.id, v=el.dataset.k==='shot'?isShot(id):isPosted(id);
    if(el.checked!==v) el.checked=v;
  });
  document.querySelectorAll('[data-card]').forEach(c=>{c.classList.toggle('done',isPosted(c.dataset.card))});
  const ws=WEEK.filter(w=>isShot(w.id)).length, wp=WEEK.filter(w=>isPosted(w.id)).length;
  bar('m-week','b-week',ws,WEEK.length);
  bar('m-weekp','b-weekp',wp,WEEK.length);
  const brandIds=WEEK.filter(w=>w.brand).map(w=>w.id).concat(IDEAS.filter(i=>i.f.includes('b')).map(i=>i.id));
  const bs=brandIds.filter(isShot).length;
  bar('m-brand','b-brand',bs,brandIds.length,bs+' из '+brandIds.length);
}

function setFlag(id,key,val){
  const cur=state[id]||{shot:false,posted:false};
  const next={shot:!!cur.shot,posted:!!cur.posted};
  next[key]=val;
  if(key==='posted'&&val) next.shot=true;
  if(key==='shot'&&!val) next.posted=false;
  state[id]=next; refresh();
  if(!db) return;
  queues[id]=(queues[id]||Promise.resolve())
    .then(()=>db.doc('progress/'+id).set(next))
    .catch(()=>note('Не получилось сохранить галочку. Она останется, пока страница открыта.'));
}

document.addEventListener('change',e=>{
  const el=e.target.closest('input[data-id]'); if(!el) return;
  setFlag(el.dataset.id,el.dataset.k,el.checked);
  if(fopen && $('p-ideas') && !$('p-ideas').hidden) { $('idea-rows').innerHTML=ideaRows(); refresh(); }
});

function drawIdeas(){ $('p-ideas').innerHTML=ideasHTML(); refresh(); }
document.addEventListener('click',e=>{
  const t=e.target.closest('#f-types .chip'), f=e.target.closest('#f-flags .chip');
  if(t){ftype=t.dataset.t;drawIdeas()}
  if(f){ if(f.dataset.f==='brand') fbrand=!fbrand; else fopen=!fopen; drawIdeas() }
});

const TABS=[['week','Неделя 1'],['ideas','Идеи'],['brands','Бренды'],['prefs','Вкусы']];
function showTab(k){
  TABS.forEach(t=>{ $('p-'+t[0]).hidden=t[0]!==k; });
  document.querySelectorAll('#tabs .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===k));
}
$('tabs').innerHTML=TABS.map(t=>'<button type="button" class="chip" data-k="'+t[0]+'" aria-pressed="false">'+t[1]+'</button>').join('');
$('tabs').addEventListener('click',e=>{const c=e.target.closest('.chip'); if(c) showTab(c.dataset.k)});

$('p-week').innerHTML=weekHTML();
drawIdeas();
$('p-brands').innerHTML=brandsHTML();
$('p-prefs').innerHTML=prefsHTML();
showTab('week');
refresh();

(async function initDb(){
  const timer=setTimeout(()=>note('Сохранение пока не отвечает. Галочки могут не сохраниться.'),10000);
  try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null }catch(e){ db=null }
  if(!db){ clearTimeout(timer); note('Галочки сохраняются, только пока страница открыта.'); return }
  db.collection('progress').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); note('') }
    const next={}; snap.docs.forEach(d=>{ next[d.id]=d.data() });
    state=next; refresh();
    if(fopen && !$('p-ideas').hidden) $('idea-rows').innerHTML=ideaRows(), refresh();
  },err=>{ clearTimeout(timer); note('Не получилось подключиться к сохранению. Галочки останутся, пока страница открыта.') });
})();
</script>
